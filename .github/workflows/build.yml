name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-fresh-clone:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build clang \
            python3 python3-pip python3-setuptools python3-wheel \
            libyaml-dev \
            binutils-mips-linux-gnu gcc-mips-linux-gnu \
            libsdl2-dev libdbus-1-dev pkg-config

      - name: Bootstrap tools (fully offline: vendored toolchain + Python wheels)
        run: tools/setup.sh

      - name: Verify dependencies including nested former submodules
        run: make recomp-deps

      - name: Doctor (skip ROM - not available in CI)
        run: tools/doctor.sh --skip-rom

      - name: Build N64Recomp tool
        run: |
          cmake -S tools/n64recomp -B tools/n64recomp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build tools/n64recomp/build --parallel

      - name: Configure recomp build tree (verifies CMake wiring without ROM)
        run: |
          cmake -S recomp -B recomp/build -DCMAKE_BUILD_TYPE=Release

      - name: Compile runtime and renderer without ROM
        run: cmake --build recomp/build --target ultramodern librecomp rt64 --parallel 2
