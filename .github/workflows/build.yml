name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-fresh-clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build clang \
            python3 python3-pip \
            binutils-mips-linux-gnu gcc-mips-linux-gnu \
            libsdl2-dev pkg-config

      - name: Bootstrap tools (no system-deps, already installed)
        run: tools/setup.sh

      - name: Ensure vendored dependencies are present (no submodules needed)
        run: |
          test -f tools/n64recomp/CMakeLists.txt
          test -f recomp/lib/N64ModernRuntime/CMakeLists.txt
          test -f recomp/lib/RT64/CMakeLists.txt
          test -f recomp/lib/RT64/src/hle/rt64_interpreter.cpp

      - name: Doctor (skip ROM - not available in CI)
        run: tools/doctor.sh --skip-rom

      - name: Build N64Recomp tool
        run: |
          cmake -S tools/n64recomp -B tools/n64recomp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build tools/n64recomp/build --parallel

      - name: Configure recomp build tree (verifies CMake wiring without ROM)
        run: |
          cmake -S recomp -B recomp/build -DCMAKE_BUILD_TYPE=Release
